<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t.title }} · {{ t.tagline }}{% endblock %}</title>
  <meta name="description" content="{{ t.hero_lead }}">
  <meta property="og:title" content="{{ t.title }}">
  <meta property="og:description" content="{{ t.hero_lead }}">
  <meta name="theme-color" content="#0b0d17">
  <link rel="icon" href="/static/fox.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css?v={{ commit }}">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="/"><img src="/static/fox.svg" alt="" width="32" height="32"><span>Black Fox</span></a>
    <nav>
      <a href="/#about">{{ t.nav_about }}</a>
      <a href="/#how">{{ t.nav_how }}</a>
      <a href="/#faq">{{ t.nav_faq }}</a>
      <a href="/ask" class="{{ 'active' if page == 'ask' }}">{{ t.nav_ask }}</a>
      <a class="lang" href="?lang={{ t.other_lang }}" hreflang="{{ t.other_lang }}">{{ t.other_lang_label }}</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <p><a href="{{ repo_url }}" rel="noopener">{{ t.footer_source }}</a>{% if commit %} · <code>{{ commit }}</code>{% endif %}</p>
    <p class="muted">© {{ year }} Black Fox Hackathon · {{ t.footer_note }}</p>
  </footer>
</body>
</html>
