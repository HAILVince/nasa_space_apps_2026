# Shared by both blackfoxhackathon server blocks (/etc/nginx/snippets/blackfox-locations.conf).
client_max_body_size 16k;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options DENY always;
# the 3D model, terrain data, JSON and scripts compress well (images are already compressed)
gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css image/svg+xml model/gltf-binary;

location = /api/chat {
    limit_req zone=bfx_ask burst=10 nodelay;   # typed design commands are cheap; the app limits AI calls itself
    limit_req_status 429;
    proxy_pass http://blackfox;
    include /etc/nginx/snippets/blackfox-proxy.conf;
    proxy_read_timeout 180s;      # an agent answer can take several tool rounds
}
location / {
    proxy_pass http://blackfox;
    include /etc/nginx/snippets/blackfox-proxy.conf;
}
