# Black Fox Hackathon (blackfox.service, uvicorn on 127.0.0.1:8086).
#   blackfoxhackathon.hu
#   blackfoxhackathon.online
# One server block per domain so each gets its own certificate; blackfox-golive.timer runs
# certbot and adds the https redirect once a domain's DNS points at this VPS.
limit_req_zone $binary_remote_addr zone=bfx_ask:10m rate=30r/m;
upstream blackfox { server 127.0.0.1:8086; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name blackfoxhackathon.hu www.blackfoxhackathon.hu;
    include /etc/nginx/snippets/blackfox-locations.conf;
}

server {
    listen 80;
    listen [::]:80;
    server_name blackfoxhackathon.online www.blackfoxhackathon.online;
    include /etc/nginx/snippets/blackfox-locations.conf;
}
