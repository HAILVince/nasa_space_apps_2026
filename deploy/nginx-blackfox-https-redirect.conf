# http -> https, Cloudflare-safe. Behind the Cloudflare proxy the scheme the VISITOR used is in CF-Visitor,
# not $scheme: in "Flexible" mode the edge reaches us over http even for https visitors (redirecting those
# would loop forever), in "Full" mode it reaches us over https even for http visitors (those still need the
# redirect). Without CF-Visitor (direct visitors) $scheme decides.
# Only included once the domain has a certificate (blackfox-golive does that).
set $bfx_redirect 0;
if ($scheme = http) { set $bfx_redirect 1; }
set $bfx_cf_scheme "";
if ($http_cf_visitor ~ "scheme.{3}(https?)") { set $bfx_cf_scheme $1; }
if ($bfx_cf_scheme = https) { set $bfx_redirect 0; }
if ($bfx_cf_scheme = http) { set $bfx_redirect 1; }
if ($bfx_redirect) { return 301 https://$host$request_uri; }
