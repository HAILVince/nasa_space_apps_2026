<title>Habitat Fire Spread</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: instrument panel. 3D/slice viewport left, controls right; tracker, validation, maps, model and sources below. */
:root{
  --bg:#eceff3; --panel:#ffffff; --ink:#15202b; --muted:#5a6875; --line:#d3dae2;
  --accent:#2445a8; --accent-soft:#dfe6fb; --ok:#1d7a4c; --warn:#a86400; --crit:#b3261e;
  --hab:#f3f5f8; --wall:#8e9aa7; --view:#e6eaf0;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1319; --panel:#151d26; --ink:#e4ebf2; --muted:#93a1af; --line:#26323f;
  --accent:#86a2ff; --accent-soft:#1d2a4d; --ok:#4cc28a; --warn:#e8a53c; --crit:#ff7b70;
  --hab:#10171e; --wall:#4a5866; --view:#0a0f14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1319; --panel:#151d26; --ink:#e4ebf2; --muted:#93a1af; --line:#26323f;
  --accent:#86a2ff; --accent-soft:#1d2a4d; --ok:#4cc28a; --warn:#e8a53c; --crit:#ff7b70;
  --hab:#10171e; --wall:#4a5866; --view:#0a0f14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1320px;margin:0 auto;display:grid;gap:16px}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:17px;margin:0;letter-spacing:.02em}
.lede{color:var(--muted);margin:2px 0 0;max-width:82ch}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:980px){.grid-main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.sim-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.clock{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.clock small{font-size:12px;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button{font:500 13px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.danger.on{background:var(--crit);border-color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{padding:3px 8px;font-size:12px}
.viewport{position:relative;width:100%;aspect-ratio:2/1;background:var(--view);border-radius:4px;overflow:hidden}
.viewport canvas{display:block;width:100%;height:100%}
#slice{cursor:crosshair}
.labels{position:absolute;inset:0;pointer-events:none}
.labels span{position:absolute;transform:translate(-50%,-50%);font:600 12px var(--f-display);color:var(--ink);background:color-mix(in srgb,var(--panel) 75%,transparent);padding:1px 6px;border-radius:3px;white-space:nowrap}
.labels span.fire{color:var(--crit)}
.vbar{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--muted)}
.vbar label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.notice{font-size:12px;color:var(--warn);margin-top:6px}
.ctl{display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.field output{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.field .sub{font-size:12px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
select{width:100%;font:14px var(--f-body);padding:6px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.presets button{text-align:left;font-size:12px;line-height:1.3;padding:7px 8px}
.presets b{display:block;font-size:13px}
.openings{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.openings button{font-size:12px;padding:4px 6px;text-align:left}
.openings button.closed{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tile{background:var(--panel);padding:10px 12px;min-width:0}
.tile .v{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .k{font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.s-burn{color:var(--crit)} .s-out{color:var(--ok)} .s-warn{color:var(--warn)} .s-idle{color:var(--muted)}
.tracker{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.tracker{grid-template-columns:1fr}}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.rooms{grid-template-columns:repeat(2,minmax(0,1fr))}}
.room{border:1px solid var(--line);border-radius:5px;padding:8px 10px;display:grid;gap:4px;min-width:0;border-left-width:4px}
.room .nm{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;font-size:13px}
.room .st{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.room dl{display:grid;grid-template-columns:auto 1fr;gap:0 8px;margin:0;font-size:12px}
.room dt{color:var(--muted)} .room dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.deck{grid-column:1/-1;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:230px;overflow:auto;font-size:12.5px}
.log li{display:grid;grid-template-columns:52px 10px 1fr;gap:6px;align-items:baseline}
.log .tm{font-family:var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.log .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.chart{width:100%;display:block}
#growth{aspect-ratio:4/1} #map{aspect-ratio:16/10} #gmap{aspect-ratio:16/10}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;display:inline-block}
.dotk{width:8px;height:8px;border-radius:50%;display:inline-block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid currentColor;white-space:nowrap}
.t-cal{color:var(--muted)} .t-ind{color:var(--accent)} .t-qual{color:var(--warn)}
.model ol{margin:8px 0 0;padding-left:20px;display:grid;gap:10px}
.model li{max-width:115ch}
.eq{display:block;font-family:var(--f-mono);font-size:13px;background:var(--hab);border:1px solid var(--line);border-radius:4px;padding:6px 10px;margin:4px 0;overflow-x:auto;white-space:nowrap}
.model p{margin:2px 0;color:var(--muted);font-size:13px}
.src ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.src a{color:var(--accent)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
pre{font-family:var(--f-mono);font-size:11.5px;background:var(--hab);border:1px solid var(--line);border-radius:4px;padding:10px;max-height:340px;overflow:auto;white-space:pre}
.foot{font-size:12px;color:var(--muted);max-width:110ch}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
